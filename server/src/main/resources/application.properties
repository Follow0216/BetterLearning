spring.application.name=server
server.port=${SERVER_PORT:8080}

# PostgreSQL（标准 Spring 变量直接绑定；密码无内置默认值，由配置校验强制要求）
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/betterlearning}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:betterlearning}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis（标准 Spring 变量直接绑定）
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.database=${SPRING_DATA_REDIS_DATABASE:0}
spring.data.redis.username=${SPRING_DATA_REDIS_USERNAME:}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}

# JWT（敏感项无内置默认值；启动时由 AppJwtProperties 校验）
app.jwt.secret-base64=${APP_JWT_SECRET_BASE64:}
app.jwt.issuer=${APP_JWT_ISSUER:}
app.jwt.audience=${APP_JWT_AUDIENCE:}
app.jwt.access-token-ttl=${APP_JWT_ACCESS_TOKEN_TTL:PT2H}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# 文档开关：同一变量同时控制 Swagger UI 与 OpenAPI 文档，默认关闭
app.docs.enabled=${APP_DOCS_ENABLED:false}
springdoc.api-docs.enabled=${APP_DOCS_ENABLED:false}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=${APP_DOCS_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html

# 注册/登录限流
app.auth.login.ip-limit=${APP_AUTH_LOGIN_IP_LIMIT:30}
app.auth.login.username-limit=${APP_AUTH_LOGIN_USERNAME_LIMIT:10}
app.auth.login.window=${APP_AUTH_LOGIN_WINDOW:PT1M}
app.auth.registration.ip-limit=${APP_AUTH_REGISTRATION_IP_LIMIT:10}
app.auth.registration.window=${APP_AUTH_REGISTRATION_WINDOW:PT1H}
