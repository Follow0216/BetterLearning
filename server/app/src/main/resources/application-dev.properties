# dev profile 专用：启动后确保一个普通 USER 业务账号存在。
# 账号由 config/DevUserAccountInitializer 依据下面两个环境变量创建或校验，
# 之后走现有 POST /api/v1/sessions + JWT 登录；此普通用户初始化器不创建 ADMIN，
# 也不启用 httpBasic/formLogin。
#
# 两个变量均为 dev 必填：缺失、空白或格式非法时在写库前阻止启动。
# 用户名去首尾空白并转小写，要求 3~32 个字符，仅中文、ASCII 字母、数字和下划线；
# 密码不 trim，要求 8~64 个字符、不能全为空白，且 UTF-8 编码不超过 72 字节。
# 密码按原始字面值读取，其中的 ${...} 不解析、不替换。
# 同名账号已存在时：角色为 USER 且密码匹配则保持账号、哈希、令牌版本和资料不变；
# 密码不同或角色不是 USER 则明确失败，不覆盖、不改密、不提权。
# 非 dev profile 不注册该初始化器，也不会创建业务账号。
#
# 本文件不声明 spring.security.user.*：SecurityProperties 会提前绑定属性并对
# 文件中的占位符做嵌套解析，可能改变密码字面值。初始化器直接读取原始环境变量，
# 业务登录始终使用数据库用户与 JWT，不启用 httpBasic/formLogin。

# 仅 dev 的管理员初始化开关；用户名/密码按原始环境字面值读取。
app.dev-admin.enabled=${APP_DEV_ADMIN_ENABLED:true}
